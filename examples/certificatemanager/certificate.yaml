apiVersion: certificatemanager.ionoscloud.io/v1alpha1
kind: Certificate
metadata:
  annotations:
    meta.upbound.io/example-id: certificatemanager/v1alpha1/certificate
  labels:
    testing.upbound.io/example-name: cert
  name: cert
spec:
  forProvider:
    certificate: "<REPLACE_WITH_YOUR_CERTIFICATE_PEM>"
    certificateChain: "<REPLACE_WITH_YOUR_CERTIFICATE_PEM>"
    name: CertificateExample
    privateKeySecretRef:
      key: privateKey
      name: example-secret
      namespace: upbound-system

---
apiVersion: v1
kind: Secret
metadata:
  name: example-secret
  namespace: upbound-system
stringData:
  privateKey: "<REPLACE_WITH_YOUR_PRIVATE_KEY_PEM>"

