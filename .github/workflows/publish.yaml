name: Publish Provider Package

on:
  workflow_run:
    workflows:
      - Tag
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: "Version string to use while publishing the package (e.g. v1.0.0-alpha.1)"
        required: true
      go-version:
        description: 'Go version to use if building needs to be done'
        default: '1.26'
        required: false

jobs:
  publish-provider-package:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: crossplane-contrib/provider-workflows/.github/workflows/publish-provider.yml@main
    permissions:
      contents: read
      packages: write
    with:
      repository: provider-upjet-ionoscloud
      registry_org: ionos-cloud
      version: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.event.inputs.version }}
      go-version: ${{ github.event.inputs['go-version'] || '1.26' }}
      cleanup-disk: true
    secrets:
      GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
      XPKG_MIRROR_ACCESS_ID: ${{ secrets.UPBOUND_MARKETPLACE_PUSH_ROBOT_USR }}
      XPKG_MIRROR_TOKEN: ${{ secrets.UPBOUND_MARKETPLACE_PUSH_ROBOT_PSW }}